# Repository requirements: only this file at .github/workflows/tik.yml
# APP_ZIP_URL: secret containing a direct HTTPS download link to TikTok-Telegram-Bot.zip
# The original bot ZIP already contains every helper this workflow needs
# All other bot and R2 secrets keep their existing names
# force_reimport refreshes application code only, queue state is preserved

name: TikTok Telegram Bot

on:
  workflow_dispatch:
    inputs:
      continue:
        description: Start another session after a successful run
        required: true
        default: true
        type: boolean
      force_reimport:
        description: Refresh the source ZIP while preserving saved jobs
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

concurrency:
  group: tiktok-telegram-bot
  cancel-in-progress: false

env:
  SESSION_SECONDS: '20400'
  PYTHONUNBUFFERED: '1'
  TELEGRAM_LOCAL_API_REQUIRED: 'true'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  BOT_DATA_DIR: ${{ github.workspace }}/state
  R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Prepare Telegram reporting
        id: prepare_telegram_reporting
        run: |
          python3 - <<'PYREPORT'
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'telegram_api.py').write_text('"""Shared Telegram endpoint and upload limits, usable before pip installs."""\nimport os\nfrom urllib.parse import urlsplit\n\nCLOUD_API = \'https://api.telegram.org\'\nLOCAL_API = \'http://127.0.0.1:8081\'\nLARGE_VIDEO_BYTES = 50_000_000\n\n\ndef api_base():\n    base = os.getenv(\'TELEGRAM_API_BASE\', CLOUD_API).strip().rstrip(\'/\')\n    parsed = urlsplit(base)\n    if (base != CLOUD_API and\n            (parsed.scheme != \'http\' or parsed.hostname not in (\'127.0.0.1\', \'localhost\')\n             or parsed.port not in (8081, 8082) or parsed.path or parsed.query\n             or parsed.fragment or parsed.username or parsed.password)):\n        raise ValueError(\'Use the cloud Bot API or the loopback local Bot API\')\n    return base\n\n\ndef is_local():\n    return api_base() != CLOUD_API\n\n\nMAX_BYTES = 2_000_000_000 if is_local() else LARGE_VIDEO_BYTES\nUPLOAD_TIMEOUT = 3600 if is_local() else 150\n', encoding='utf-8')
          Path(os.environ['RUNNER_TEMP'], 'crash_reports.py').write_text('"""Safe application error events for the independent Telegram supervisor."""\nimport json\nimport logging\nimport os\nfrom pathlib import Path\nimport re\nimport sys\n\nEVENT_PREFIX = \'@@TIKTOK_ISSUE_V1@@\'\nMAX_DETAILS = 12000\n\n\ndef sanitize(value):\n    value = str(value)\n    for key, secret in sorted(os.environ.items(), key=lambda item: len(item[1]), reverse=True):\n        if secret and any(word in key.upper() for word in (\'TOKEN\', \'SECRET\', \'PASSWORD\', \'ACCESS_KEY\', \'COOKIES\', \'API_HASH\', \'ZIP_URL\', \'TELE_ZIP\')):\n            value = value.replace(secret, \'[redacted]\')\n    value = re.sub(r\'\\b\\d{6,}:[A-Za-z0-9_-]{20,}\\b\', \'[redacted]\', value)\n    value = re.sub(r\'(?im)((?:authorization|cookie|set-cookie)\\s*[:=])[^\\r\\n]*\', r\'\\1 [redacted]\', value)\n    value = re.sub(r\'(https?://)[^\\s/@]+:[^\\s/@]+@\', r\'\\1[redacted]@\', value)\n    value = re.sub(r\'(?i)([?&](?:token|key|signature|sig|password|secret|auth|credential|x-amz-[\\w-]+)=)[^\\s&#\\"\\\']+\', r\'\\1[redacted]\', value)\n    return value\n\n\ndef exception_details(exc):\n    # Exception strings, source lines, locals and Telegram method reprs can\n    # contain tokens, cookies, captions or signed URLs, so keep only locations.\n    lines, seen = [], set()\n    while exc is not None and id(exc) not in seen and len(seen) < 8:\n        seen.add(id(exc))\n        lines.append(type(exc).__name__)\n        frame = exc.__traceback__\n        for _ in range(40):\n            if frame is None:\n                break\n            code = frame.tb_frame.f_code\n            lines.append(f\'  {Path(code.co_filename).name}:{frame.tb_lineno} in {code.co_name}\')\n            frame = frame.tb_next\n        if type(exc).__name__ == \'TelegramConflictError\':\n            lines.append(\'Another application is polling with this bot token, stop the other bot instance\')\n        elif type(exc).__name__ == \'TelegramUnauthorizedError\':\n            lines.append(\'Telegram rejected the bot token, check TELEGRAM_BOT_TOKEN\')\n        if isinstance(exc, OSError) and isinstance(exc.errno, int):\n            lines.append(f\'OS error number: {exc.errno}\')\n        exc = exc.__cause__ or (None if exc.__suppress_context__ else exc.__context__)\n        if exc is not None:\n            lines.append(\'Caused by\')\n    return sanitize(\'\\n\'.join(lines))[:MAX_DETAILS]\n\n\ndef emit_issue(title, details=\'\', kind=\'error\'):\n    try:\n        event = {\'kind\': kind, \'title\': sanitize(title)[:500],\n                 \'details\': sanitize(details)[:MAX_DETAILS]}\n        print(EVENT_PREFIX + json.dumps(event, ensure_ascii=False), flush=True)\n    except Exception:\n        # Reporting must never replace the application\'s original failure.\n        pass\n\n\nclass SafeFormatter(logging.Formatter):\n    def formatException(self, exc_info):\n        return exception_details(exc_info[1])\n\n    def format(self, record):\n        return sanitize(super().format(record))\n\n\nclass IssueHandler(logging.Handler):\n    def __init__(self):\n        super().__init__(logging.WARNING)\n\n    def emit(self, record):\n        try:\n            kind = getattr(record, \'report_kind\', \'warning\' if record.levelno == logging.WARNING else \'error\')\n            details = exception_details(record.exc_info[1]) if record.exc_info else \'\'\n            emit_issue(record.getMessage(), details, kind)\n        except Exception:\n            pass\n\n\ndef configure_logging():\n    stream = logging.StreamHandler(sys.stderr)\n    stream.setFormatter(SafeFormatter(\'%(asctime)s | %(levelname)s | %(message)s\'))\n    logging.basicConfig(level=logging.INFO, handlers=[stream, IssueHandler()], force=True)\n\n\ndef background_error(loop, context):\n    exc = context.get(\'exception\')\n    logging.error(\'Background task failed\', exc_info=(type(exc), exc, exc.__traceback__) if exc else None)\n', encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('BOT_WORKFLOW_STARTED_AT='+str(__import__('time').time())+'\n')
          PYREPORT

      - name: Prepare Telegram log supervisor
        id: prepare_telegram_log_supervisor
        run: |
          python3 - <<'PYREPORT'
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'telegram_logs.py').write_text('"""Stdlib Telegram reporting, usable before application dependencies are installed."""\nimport datetime as dt\nfrom collections import OrderedDict\nimport json\nimport os\nfrom pathlib import Path\nimport re\nimport signal\nimport subprocess\nimport sys\nimport threading\nimport time\nimport urllib.request\nimport uuid\n\nfrom crash_reports import EVENT_PREFIX, MAX_DETAILS, exception_details, sanitize\nfrom telegram_api import api_base, CLOUD_API\n\nCHAT_ID = \'-1004434678187\'\nINTERVAL_SECONDS = 3600\nMAX_LOG_BYTES = 8 * 1024 * 1024\nMAX_CONTEXT_BYTES = 96 * 1024\nERROR_INTERVAL_SECONDS = 5\nERROR_REPEAT_SECONDS = 300\n\n\ndef timestamp():\n    return dt.datetime.now(dt.timezone.utc).strftime(\'%Y%m%dT%H%M%SZ\')\n\n\ndef run_url():\n    server = os.getenv(\'GITHUB_SERVER_URL\', \'https://github.com\').rstrip(\'/\')\n    repo, run = os.getenv(\'GITHUB_REPOSITORY\', \'\'), os.getenv(\'GITHUB_RUN_ID\', \'\')\n    if re.fullmatch(r\'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\', repo) and run.isascii() and run.isdecimal():\n        return sanitize(f\'{server}/{repo}/actions/runs/{run}\')\n    return \'\'\n\n\ndef warning():\n    print(\'Telegram report upload failed, bot and workflow exit status are preserved\', file=sys.stderr, flush=True)\n\n\ndef send_document(data, filename, caption):\n    token = os.getenv(\'TELEGRAM_BOT_TOKEN\', \'\').strip()\n    if not token:\n        warning()\n        return False\n    boundary = uuid.uuid4().hex\n    parts = []\n    for name, value in [(\'chat_id\', CHAT_ID), (\'caption\', sanitize(caption))]:\n        parts.append(f\'--{boundary}\\r\\nContent-Disposition: form-data; name="{name}"\\r\\n\\r\\n{value}\\r\\n\'.encode())\n    parts.extend([\n        f\'--{boundary}\\r\\nContent-Disposition: form-data; name="document"; filename="{filename}"\\r\\nContent-Type: text/plain; charset=utf-8\\r\\n\\r\\n\'.encode(),\n        sanitize(data.decode(\'utf-8\', errors=\'replace\')).encode(),\n        f\'\\r\\n--{boundary}--\\r\\n\'.encode(),\n    ])\n    request = urllib.request.Request(\n        f\'{api_base()}/bot{token}/sendDocument\', data=b\'\'.join(parts),\n        headers={\'Content-Type\': f\'multipart/form-data; boundary={boundary}\'}, method=\'POST\')\n    try:\n        with urllib.request.urlopen(request, timeout=30) as response:\n            if json.loads(response.read(65536)).get(\'ok\') is not True:\n                raise ValueError(\'Upload rejected\')\n        return True\n    except Exception:\n        # Never print the exception or API response: they can contain credentials\n        warning()\n        return False\n\n\nclass LogBuffer:\n    def __init__(self, limit=None):\n        self.lines = []\n        self.size = 0\n        self.sequence = 0\n        self.truncated = False\n        self.lock = threading.Lock()\n        self.limit = MAX_LOG_BYTES if limit is None else limit\n\n    def append(self, line):\n        data = sanitize(line).encode(\'utf-8\', errors=\'replace\')\n        with self.lock:\n            self.sequence += 1\n            if len(data) > self.limit:\n                data = data[-self.limit:]\n                self.truncated = True\n            self.lines.append((self.sequence, data))\n            self.size += len(data)\n            while self.size > self.limit:\n                self.size -= len(self.lines.pop(0)[1])\n                self.truncated = True\n\n    def snapshot(self):\n        with self.lock:\n            prefix = b\'[Older log entries omitted to keep the file bounded]\\n\' if self.truncated else b\'\'\n            return self.sequence, prefix + b\'\'.join(data for _, data in self.lines)\n\n    def acknowledge(self, sequence):\n        with self.lock:\n            self.lines = [(seq, data) for seq, data in self.lines if seq > sequence]\n            self.size = sum(len(data) for _, data in self.lines)\n            self.truncated = False\n\n\ndef upload_logs(buffer, final=False):\n    sequence, data = buffer.snapshot()\n    if final and not data:\n        return\n    now = timestamp()\n    kind = \'final\' if final else \'hourly\'\n    header = f\'TikTok bot {kind} log, UTC {now}\\n\'\n    data = header.encode() + (data or b\'No bot log entries during this interval\\n\')\n    if send_document(data, f\'bot-log-{kind}-{now}.txt\', f\'TikTok bot {kind} log\'):\n        buffer.acknowledge(sequence)\n\n\ndef parse_issue(line):\n    if not line.startswith(EVENT_PREFIX):\n        return None\n    try:\n        event = json.loads(line[len(EVENT_PREFIX):])\n        if not isinstance(event, dict) or event.get(\'kind\') not in (\'warning\', \'error\', \'crash\'):\n            return None\n        if not isinstance(event.get(\'title\'), str) or not isinstance(event.get(\'details\', \'\'), str):\n            return None\n        return {\'kind\': event[\'kind\'], \'title\': sanitize(event[\'title\'])[:500],\n                \'details\': sanitize(event.get(\'details\', \'\'))[:MAX_DETAILS]}\n    except (ValueError, TypeError, RecursionError):\n        return None\n\n\nclass IssueBuffer:\n    """Bounded error groups, independent of the acknowledged hourly log."""\n    def __init__(self, context):\n        self.context = context\n        self.pending = OrderedDict()\n        self.sent = OrderedDict()\n        self.lock = threading.Lock()\n\n    def append(self, event):\n        key = event[\'kind\'], re.sub(r\'\\bjob \\d+\\b\', \'job <id>\', event[\'title\'], flags=re.I)\n        with self.lock:\n            if key not in self.pending and len(self.pending) >= 40:\n                key = (\'warning\', \'Additional runtime errors\')\n                event = {\'kind\': \'warning\', \'title\': key[1], \'details\': \'\'}\n            previous = self.pending.get(key, {\'count\': 0})\n            self.pending[key] = dict(event, count=previous[\'count\'] + 1)\n\n    def flush(self, final=False):\n        now = time.monotonic()\n        with self.lock:\n            groups = [(key, value.copy()) for key, value in self.pending.items()\n                      if final or key not in self.sent or now-self.sent[key] >= ERROR_REPEAT_SECONDS]\n        if not groups:\n            return\n        tag = \'#error\' if any(value[\'kind\'] == \'error\' for _, value in groups) else \'#warning\'\n        summary = \'\\n\'.join(f"{value[\'title\']} (×{value[\'count\']})" for _, value in groups)\n        # The short caption stays below Telegram\'s 1024 UTF-16-unit limit.\n        caption = tag + \'\\n\\n\' + summary[:300]\n        link = run_url()\n        if link:\n            caption += \'\\n\\nRun: \' + link\n        details = \'\\n\\n\'.join(f"{value[\'title\']}\\nOccurrences: {value[\'count\']}\\n{value[\'details\']}"\n                              for _, value in groups)\n        data = (tag + \'\\nUTC: \' + timestamp() + \'\\nRun: \' + link + \'\\n\\n\' + details).encode()\n        data += b\'\\n\\nRecent bot log\\n\' + self.context.snapshot()[1]\n        if not send_document(data, f\'bot-errors-{timestamp()}.txt\', caption):\n            return\n        with self.lock:\n            for key, value in groups:\n                current = self.pending.get(key)\n                if current is not None:\n                    current[\'count\'] -= value[\'count\']\n                    if current[\'count\'] <= 0:\n                        del self.pending[key]\n                self.sent[key] = now\n                self.sent.move_to_end(key)\n            while len(self.sent) > 200:\n                self.sent.popitem(last=False)\n\n\ndef marker_path():\n    temp = os.getenv(\'RUNNER_TEMP\')\n    return Path(temp)/\'tiktok-crash-reported.json\' if temp else None\n\n\ndef crash_reported():\n    path = marker_path()\n    try:\n        marker = json.loads(path.read_text()) if path else {}\n        return bool(marker and marker.get(\'run\') == os.getenv(\'GITHUB_RUN_ID\', \'\')\n                    and marker.get(\'attempt\') == os.getenv(\'GITHUB_RUN_ATTEMPT\', \'\'))\n    except (OSError, ValueError, TypeError):\n        return False\n\n\ndef report_crash(returncode, context, event=None):\n    event = event or {\'title\': \'Bot process stopped unexpectedly\', \'details\': \'\'}\n    title = f"{event[\'title\']}\\nExit code: {returncode}"\n    link = run_url()\n    caption = \'#crash\\n\\n\' + title[:240]\n    if event.get(\'details\'):\n        caption += \'\\n\' + event[\'details\'].splitlines()[0][:120]\n    if link:\n        caption += \'\\n\\nRun: \' + link\n    data = (caption + \'\\nUTC: \' + timestamp() + \'\\n\\n\' + event.get(\'details\', \'\')).encode()\n    data += b\'\\n\\nRecent bot log\\n\' + context.snapshot()[1]\n    if send_document(data, f\'bot-crash-{timestamp()}.txt\', caption):\n        path = marker_path()\n        if path:\n            try:\n                path.write_text(json.dumps({\'run\': os.getenv(\'GITHUB_RUN_ID\', \'\'),\n                                            \'attempt\': os.getenv(\'GITHUB_RUN_ATTEMPT\', \'\')}))\n            except OSError:\n                pass\n        return True\n    return False\n\n\ndef workflow_issues():\n    try:\n        steps = json.loads(os.getenv(\'WORKFLOW_STEPS\', \'{}\'))\n    except ValueError:\n        steps = {}\n    if not isinstance(steps, dict):\n        steps = {}\n    # Do not copy step outputs, they can include credentials or private URLs.\n    return [(name, step.get(\'outcome\')) for name, step in steps.items()\n            if re.fullmatch(r\'[A-Za-z_][A-Za-z0-9_-]{0,79}\', name) and isinstance(step, dict)\n            and step.get(\'outcome\') in (\'failure\', \'cancelled\')][:50]\n\n\ndef report_workflow(data):\n    issues = workflow_issues()\n    status = os.getenv(\'WORKFLOW_STATUS\', \'\')\n    if status not in (\'failure\', \'cancelled\') and not issues:\n        return\n    if issues and all(name == \'session\' for name, _ in issues) and crash_reported():\n        return  # The supervisor already delivered this particular crash.\n    tag = \'#error\' if status == \'failure\' or any(outcome == \'failure\' for _, outcome in issues) else \'#warning\'\n    title = \'Workflow failed\' if tag == \'#error\' else \'Workflow was cancelled\'\n    lines = [tag, \'\', title, *[f\'{name}: {outcome}\' for name, outcome in issues]]\n    if link := run_url():\n        lines.extend([\'\', \'Run: \' + link])\n    caption = \'\\n\'.join([tag, \'\', title, *[f\'{name}: {outcome}\' for name, outcome in issues[:2]]])[:350]\n    if link:\n        caption += \'\\n\\nRun: \' + link\n    document = \'\\n\'.join(lines).encode() + b\'\\n\\n\' + data\n    send_document(document, f\'workflow-error-{timestamp()}.txt\', caption)\n\n\ndef run_bot(script, interval=INTERVAL_SECONDS):\n    buffer = LogBuffer()\n    context = LogBuffer(MAX_CONTEXT_BYTES)\n    issues = IssueBuffer(context)\n    fatal = None\n    returncode = 1\n    stopped = threading.Event()\n    # Ensure the application\'s final event arrives even when stdout is a pipe.\n    try:\n        child = subprocess.Popen([sys.executable, \'-u\', script], stdout=subprocess.PIPE, stderr=subprocess.STDOUT)\n    except Exception as exc:\n        report_crash(1, context, {\'title\': \'Could not start the bot process\', \'details\': exception_details(exc)})\n        return 1\n    previous = {}\n\n    def forward(signum, frame):\n        if child.poll() is None:\n            child.send_signal(signum)\n\n    for signum in (signal.SIGINT, signal.SIGTERM):\n        previous[signum] = signal.signal(signum, forward)\n\n    def periodic():\n        nonlocal fatal\n        next_log = time.monotonic()+interval\n        while not stopped.wait(min(ERROR_INTERVAL_SECONDS, max(0, next_log-time.monotonic()))):\n            if os.getenv(\'BOT_API_PID\',\'\').isdecimal():\n                pid = int(os.environ[\'BOT_API_PID\'])\n                try:\n                    os.kill(pid,0)\n                    stat = Path(f\'/proc/{pid}/stat\')\n                    dead = stat.is_file() and stat.read_text().rsplit(\')\',1)[1].split()[0]==\'Z\'\n                except (OSError,IndexError):\n                    dead = True\n                if dead and child.poll() is None:\n                    fatal = {\'title\':\'Local Bot API server stopped unexpectedly\',\'details\':\'\'}\n                    child.terminate()\n            issues.flush()\n            if time.monotonic() >= next_log:\n                upload_logs(buffer)\n                next_log = time.monotonic()+interval\n\n    reporter = threading.Thread(target=periodic, daemon=True)\n    reporter.start()\n    try:\n        # Bounded reads prevent a single unterminated line from exhausting memory\n        while True:\n            raw = child.stdout.readline(65536)\n            if not raw:\n                break\n            decoded = raw.decode(\'utf-8\', errors=\'replace\')\n            event = parse_issue(decoded)\n            if event:\n                if event[\'kind\'] == \'crash\':\n                    fatal = event\n                else:\n                    issues.append(event)\n                continue\n            line = sanitize(decoded)\n            sys.stdout.write(line)\n            sys.stdout.flush()\n            buffer.append(line)\n            context.append(line)\n        returncode = child.wait()\n    except Exception as exc:\n        fatal = {\'title\': \'Bot supervisor failed\', \'details\': exception_details(exc)}\n        returncode = 1\n    finally:\n        stopped.set()\n        if child.poll() is None:\n            child.terminate()\n            try:\n                child.wait(timeout=10)\n            except subprocess.TimeoutExpired:\n                child.kill()\n                child.wait()\n        child.stdout.close()\n        # The context survives hourly acknowledgement, even for a silent crash.\n        # A slow hourly upload must not delay the crash alert.\n        if returncode != 0 or fatal:\n            failure_code = (returncode if returncode >= 0 else 128-returncode) or 1\n            report_crash(failure_code, context, fatal)\n        reporter.join()  # HTTP uploads have a finite timeout\n        for signum, handler in previous.items():\n            signal.signal(signum, handler)\n        issues.flush(final=True)\n        upload_logs(buffer, final=True)\n    return (returncode if returncode >= 0 else 128 - returncode) or (1 if fatal else 0)\n\n\ndef main():\n    if len(sys.argv) != 3 or sys.argv[1] not in (\'run\', \'diagnostics\'):\n        raise SystemExit(\'Usage: telegram_logs.py run BOT.py | diagnostics FILE.txt\')\n    if sys.argv[1] == \'run\':\n        raise SystemExit(run_bot(sys.argv[2]))\n    try:\n        data = Path(sys.argv[2]).read_bytes()\n    except OSError:\n        warning()\n        data = b\'Diagnostics file was unavailable\\n\'\n    report_workflow(data)\n    send_document(data, \'diagnostics.txt\', \'TikTok bot diagnostics\')\n    if os.getenv(\'TELEGRAM_LOCAL_API_REQUIRED\')==\'true\' and api_base()==CLOUD_API:\n        # Early setup reports may temporarily register the cloud endpoint.\n        # Deregister it again before the next local-server attempt.\n        token = os.getenv(\'TELEGRAM_BOT_TOKEN\',\'\').strip()\n        if token:\n            try:\n                request = urllib.request.Request(f\'{CLOUD_API}/bot{token}/logOut\',data=b\'\',method=\'POST\')\n                with urllib.request.urlopen(request,timeout=30) as response:\n                    response.read(65536)\n            except Exception:\n                warning()\n\n\nif __name__ == \'__main__\':\n    main()\n', encoding='utf-8')
          PYREPORT

      - name: Validate local Telegram API credentials
        id: api_credentials
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python3 - <<'PYAPICREDENTIALS'
          import os,re,sys
          identifier=os.getenv('TELEGRAM_API_ID','').strip()
          if not identifier.isascii() or not identifier.isdecimal() or not 0<int(identifier)<2**31:
              sys.exit('Add TELEGRAM_API_ID from my.telegram.org to repository Actions secrets')
          if not re.fullmatch('[A-Fa-f0-9]{32}',os.getenv('TELEGRAM_API_HASH','').strip()):
              sys.exit('Add TELEGRAM_API_HASH from my.telegram.org to repository Actions secrets')
          print('Local Telegram API credentials configured')
          PYAPICREDENTIALS

      - name: Restore neofetch cache
        id: neofetch_cache
        uses: actions/cache/restore@main
        with:
          path: ~/.neofetch
          key: tiktok-neofetch-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Show system information with neofetch
        id: show_system_information_with_neofetch
        run: |
          NEOFETCH_DIR="$HOME/.neofetch"
          mkdir -p "$NEOFETCH_DIR"
          if [ -x "$NEOFETCH_DIR/neofetch" ]; then
            echo "Using cached neofetch"
          else
            if ! command -v neofetch >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y --no-install-recommends neofetch
            fi
            cp "$(command -v neofetch)" "$NEOFETCH_DIR/neofetch"
            chmod +x "$NEOFETCH_DIR/neofetch"
          fi
          "$NEOFETCH_DIR/neofetch"

      - name: Save neofetch cache
        id: save_neofetch_cache
        if: ${{ steps.neofetch_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          path: ~/.neofetch
          key: ${{ steps.neofetch_cache.outputs.cache-primary-key }}

      - name: Check out workflow
        id: check_out_workflow
        uses: actions/checkout@main

      - name: Set up Python
        id: python
        uses: actions/setup-python@main
        with:
          python-version: '>=3.12 <3.15'
          check-latest: true

      - name: Restore imported application
        id: restore_imported_application
        if: ${{ inputs.force_reimport != true }}
        uses: actions/cache/restore@main
        with:
          path: app
          key: tiktok-source-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tiktok-source-${{ runner.os }}-${{ github.ref_name }}-

      - name: Import application from ZIP or reuse cache
        id: import_application_from_zip_or_reuse_cache
        env:
          APP_ZIP_URL: ${{ secrets.TELE_ZIP }}
          FORCE_REIMPORT: ${{ inputs.force_reimport }}
        run: |
          python - <<'PY'
          """Optional ZIP source import, state always lives outside the imported code"""
          import os
          from pathlib import Path, PurePosixPath
          import shutil
          import sys
          import tempfile
          import urllib.request
          import zipfile


          def extract_project(archive,destination):
              with zipfile.ZipFile(archive) as z:
                  files = z.infolist()
                  if sum(f.file_size for f in files)>30_000_000 or len(files)>500:
                      raise ValueError('Bot ZIP is too large')
                  for item in files:
                      p = PurePosixPath(item.filename)
                      mode = item.external_attr>>16
                      if p.is_absolute() or '..' in p.parts or '\\' in item.filename or mode & 0o170000 == 0o120000:
                          raise ValueError('Unsafe ZIP entry')
                  with tempfile.TemporaryDirectory() as td:
                      z.extractall(td)
                      candidates = [p.parent for p in Path(td).rglob('bot.py') if (p.parent/'requirements.txt').is_file()]
                      if len(candidates)!=1:
                          raise ValueError('ZIP must contain exactly one bot project')
                      source = candidates[0]
                      if destination.exists():
                          shutil.rmtree(destination)
                      destination.mkdir(parents=True)
                      # Never import saved credentials or queue data from a code ZIP
                      for file in source.iterdir():
                          if file.is_file() and (file.suffix=='.py' or file.name in ('requirements.txt','README.md')):
                              shutil.copy2(file,destination/file.name)
                      workflow = source/'.github/workflows/tik.yml'
                      if workflow.is_file():
                          target = destination/'.github/workflows/tik.yml'
                          target.parent.mkdir(parents=True)
                          shutil.copy2(workflow,target)


          def main():
              root = Path.cwd()
              app = root/'app'
              url = os.getenv('APP_ZIP_URL','').strip()
              refresh = os.getenv('FORCE_REIMPORT','false') == 'true'
              required = ('bot.py','worker.py','state.py','common.py','backup.py',
                          'workflow_tools.py','requirements.txt','i18n.py','sound_browser.py','video_compression.py','broadcasts.py','dependency_updates.py','metadata_files.py','metadata_formats.py',
                          'telegram_logs.py','crash_reports.py','telegram_api.py','local_api.py')
              cache_complete = all((app/name).is_file() and not (app/name).is_symlink()
                                   for name in required)
              legacy = (app/'compression.py').exists() or (app/'compression.py').is_symlink()
              if refresh or not cache_complete or legacy:
                  if not url:
                      raise SystemExit('Set APP_ZIP_URL to the direct HTTPS download URL of your bot ZIP')
                  if not url.startswith('https://'):
                      raise SystemExit('APP_ZIP_URL must use HTTPS')
                  with tempfile.TemporaryDirectory() as td:
                      archive = Path(td)/'app.zip'
                      with urllib.request.urlopen(url,timeout=60) as response,archive.open('wb') as out:
                          if not response.geturl().startswith('https://'):
                              raise ValueError('ZIP redirect must use HTTPS')
                          count = 0
                          while chunk := response.read(1024*1024):
                              count += len(chunk)
                              if count > 30_000_000:
                                  raise ValueError('Bot ZIP is too large')
                              out.write(chunk)
                      extract_project(archive,app)
              if (app/'compression.py').exists() or (app/'compression.py').is_symlink():
                  raise SystemExit('Replace the hosted bot ZIP with the updated version containing video_compression.py')
              if any(not (app/name).is_file() or (app/name).is_symlink() for name in required):
                  raise SystemExit('Bot ZIP is missing required application files or workflow_tools.py')
              # Preserve the actual running workflow in future R2 backups
              workflow_ref = os.getenv('GITHUB_WORKFLOW_REF','')
              if workflow_ref:
                  relative = workflow_ref.split('/',2)[2].rsplit('@',1)[0]
                  workflow = root/relative
                  if workflow.is_file():
                      target = app/'.github/workflows/tik.yml'
                      target.parent.mkdir(parents=True,exist_ok=True)
                      shutil.copy2(workflow,target)
              with open(os.environ['GITHUB_ENV'],'a') as out:
                  out.write('BOT_SOURCE_DIR='+str(app)+'\n')
              print('Bot source ready, application files are loaded from the ZIP or cache')


          if __name__=='__main__':
              try:
                  main()
              except Exception as exc:
                  print(f'Source import failed, {type(exc).__name__}',file=sys.stderr)
                  sys.exit(1)
          PY

      - name: Cache pip downloads
        id: cache_pip_downloads
        uses: actions/cache@main
        with:
          path: ~/.cache/pip
          key: tiktok-pip-${{ runner.os }}-${{ runner.arch }}-py-${{ steps.python.outputs.python-version }}-${{ hashFiles('app/requirements.txt') }}
          restore-keys: |
            tiktok-pip-${{ runner.os }}-${{ runner.arch }}-py-${{ steps.python.outputs.python-version }}-

      - name: Install dependencies
        id: dependencies
        run: |
          python -m pip install --upgrade -r "$BOT_SOURCE_DIR/requirements.txt"
          python -m pip check
          python - <<'PY'
          from importlib.metadata import version
          import os
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('playwright_version='+version('playwright')+'\n')
          PY

      - name: Restore FFmpeg cache
        id: ffmpeg_cache
        uses: actions/cache/restore@main
        with:
          path: ~/.ffmpeg
          key: tiktok-ffmpeg-${{ runner.os }}-${{ runner.arch }}-yt-dlp-linux64-gpl-v1

      - name: Install and check FFmpeg
        id: install_and_check_ffmpeg
        run: |
          set -euo pipefail
          FF_DIR="$HOME/.ffmpeg"
          mkdir -p "$FF_DIR"
          if [ -x "$FF_DIR/bin/ffmpeg" ] && [ -x "$FF_DIR/bin/ffprobe" ]; then
            echo "FFmpeg and ffprobe are already cached, not downloading"
          else
            ARCHIVE_URL="https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            TMPFILE="$(mktemp "${RUNNER_TEMP:-/tmp}/tiktok-ffmpeg.XXXXXX.tar.xz")"
            trap 'rm -f "$TMPFILE"' EXIT
            echo "Downloading the FFmpeg static build"
            curl --location --fail --retry 3 --connect-timeout 30 --max-time 300 --output "$TMPFILE" "$ARCHIVE_URL"
            tar -xJf "$TMPFILE" -C "$FF_DIR" --strip-components=1
          fi
          test -x "$FF_DIR/bin/ffmpeg"
          test -x "$FF_DIR/bin/ffprobe"
          echo "$FF_DIR/bin" >> "$GITHUB_PATH"
          export PATH="$FF_DIR/bin:$PATH"
          ffmpeg -version
          ffmpeg -hide_banner -encoders 2>/dev/null | grep 'libx264' >/dev/null
          ffmpeg -hide_banner -encoders 2>/dev/null | grep ' AAC ' >/dev/null
          ffmpeg -hide_banner -filters 2>/dev/null | grep ' zscale ' >/dev/null
          ffmpeg -hide_banner -filters 2>/dev/null | grep ' tonemap ' >/dev/null
          ffprobe -version

      - name: Save FFmpeg cache
        id: save_ffmpeg_cache
        if: ${{ steps.ffmpeg_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          path: ~/.ffmpeg
          key: ${{ steps.ffmpeg_cache.outputs.cache-primary-key }}

      - name: Cache Chromium
        id: cache_chromium
        # Browser binaries remain separate from video encoding and user data.
        uses: actions/cache@main
        with:
          path: ~/.cache/ms-playwright
          key: tiktok-chromium-${{ runner.os }}-${{ runner.arch }}-pw-${{ steps.dependencies.outputs.playwright_version }}

      - name: Install Chromium for sound links
        id: install_chromium_for_sound_links
        run: python -m playwright install --with-deps --no-shell chromium

      - name: Check R2 configuration
        id: check_r2_configuration
        run: python "$BOT_SOURCE_DIR/backup.py" check

      - name: Resolve official Telegram Bot API source
        id: api_source
        run: |
          set -euo pipefail
          BOT_API_SOURCE_SHA="$(git ls-remote https://github.com/tdlib/telegram-bot-api.git HEAD | cut -f1)"
          [[ "$BOT_API_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$BOT_API_SOURCE_SHA" >> "$GITHUB_OUTPUT"
          python3 - <<'PYAPIPLATFORM'
          import os,platform
          release=platform.freedesktop_os_release()
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('platform='+release['ID']+'-'+release['VERSION_ID']+'-'+platform.machine()+'\n')
          PYAPIPLATFORM

      - name: Restore compiled Telegram Bot API
        id: api_binary
        uses: actions/cache/restore@main
        with:
          path: ~/.telegram-bot-api
          key: tiktok-api-${{ steps.api_source.outputs.platform }}-${{ steps.api_source.outputs.sha }}-v1

      - name: Build official Telegram Bot API if missing
        id: api_build
        if: ${{ steps.api_binary.outputs.cache-hit != 'true' }}
        env:
          BOT_API_SOURCE_SHA: ${{ steps.api_source.outputs.sha }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake make gperf libssl-dev zlib1g-dev
          BOT_API_SOURCE_DIR="$RUNNER_TEMP/telegram-bot-api-source"
          git init "$BOT_API_SOURCE_DIR"
          git -C "$BOT_API_SOURCE_DIR" remote add origin https://github.com/tdlib/telegram-bot-api.git
          git -C "$BOT_API_SOURCE_DIR" fetch --depth 1 origin "$BOT_API_SOURCE_SHA"
          git -C "$BOT_API_SOURCE_DIR" checkout --detach FETCH_HEAD
          git -C "$BOT_API_SOURCE_DIR" submodule update --init --recursive --depth 1
          cmake -S "$BOT_API_SOURCE_DIR" -B "$BOT_API_SOURCE_DIR/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/telegram-bot-api-install"
          cmake --build "$BOT_API_SOURCE_DIR/build" --target install --parallel 2
          mkdir -p "$HOME/.telegram-bot-api"
          install -m 755 "$RUNNER_TEMP/telegram-bot-api-install/bin/telegram-bot-api" "$HOME/.telegram-bot-api/telegram-bot-api"

      - name: Check compiled Telegram Bot API
        id: api_binary_check
        run: '"$HOME/.telegram-bot-api/telegram-bot-api" --version'

      - name: Save compiled Telegram Bot API
        id: api_binary_save
        if: ${{ steps.api_binary.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@main
        with:
          path: ~/.telegram-bot-api
          key: ${{ steps.api_binary.outputs.cache-primary-key }}

      - name: Restore queue cache
        id: restore_queue_cache
        uses: actions/cache/restore@main
        with:
          path: |
            state/state.db
            state/telegram-api.enc
          key: tiktok-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tiktok-state-${{ runner.os }}-${{ github.ref_name }}-

      - name: Validate state or restore R2 backup
        id: validate_state_or_restore_r2_backup
        run: python "$BOT_SOURCE_DIR/backup.py" restore

      - name: Start local Telegram Bot API
        id: local_api_start
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python "$BOT_SOURCE_DIR/local_api.py" start

      - name: Run bot
        id: session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_ID: ${{ secrets.TELE_OWNER_ID || vars.TELE_OWNER_ID }}
          QUEUE_BYPASS_USER_ID: ${{ secrets.QUEUE_BYPASS_USER_ID || vars.QUEUE_BYPASS_USER_ID }}
          TIKTOK_COOKIES_BASE64: ${{ secrets.TIKTOK_COOKIES_BASE64 }}
        run: |
          # Missing optional secrets are empty strings in GitHub Actions
          export QUEUE_BYPASS_USER_ID="${QUEUE_BYPASS_USER_ID:-0}"
          python - <<'PYCONFIG'
          import base64
          import binascii
          import os
          import sys
          import time

          # Keep the requested session on warm runs, reserve time for a cold build.
          remaining=int(355*60-(time.time()-float(os.getenv('BOT_WORKFLOW_STARTED_AT',time.time())))-600)
          if remaining<60:
              sys.exit('Not enough workflow time remains to start a safe bot session')
          actual=min(int(os.environ['SESSION_SECONDS']),remaining)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('SESSION_SECONDS='+str(actual)+'\n')

          def fail(message):
              print('::error::'+message, file=sys.stderr)
              sys.exit(1)

          if not os.getenv('TELEGRAM_BOT_TOKEN', '').strip():
              fail('Set TELEGRAM_BOT_TOKEN to the bot token from BotFather')
          for name, optional in (('OWNER_ID', False), ('QUEUE_BYPASS_USER_ID', True)):
              value = os.getenv(name, '').strip()
              if not value or not value.isascii() or not value.isdecimal():
                  fail(name+' must be a numeric Telegram user ID, not a username or Discord ID')
              if int(value) <= 0 and not (optional and int(value) == 0):
                  fail(name+' must be a positive Telegram user ID')
          cookies = os.getenv('TIKTOK_COOKIES_BASE64', '').strip()
          if cookies:
              try:
                  decoded = base64.b64decode(cookies, validate=True)
              except (ValueError, binascii.Error):
                  fail('TIKTOK_COOKIES_BASE64 must contain valid base64 encoded cookies')
              if b'\t' not in decoded:
                  fail('TIKTOK_COOKIES_BASE64 must contain a base64 encoded Netscape cookie file')
          print('Bot configuration validated')
          PYCONFIG
          export SESSION_SECONDS="$(python -c 'import os,time; print(min(int(os.environ["SESSION_SECONDS"]),int(355*60-(time.time()-float(os.environ["BOT_WORKFLOW_STARTED_AT"]))-600)))')"
          python "$RUNNER_TEMP/telegram_logs.py" run "$BOT_SOURCE_DIR/bot.py"
          python "$BOT_SOURCE_DIR/backup.py" receipt

      - name: Checkpoint encrypted local API state
        id: local_api_checkpoint
        if: ${{ always() && steps.local_api_start.outcome == 'success' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python "$BOT_SOURCE_DIR/local_api.py" checkpoint

      - name: Back up to R2 and verify before pruning
        id: back_up_to_r2_and_verify_before_pruning
        if: ${{ success() && steps.session.outputs.ok == 'true' }}
        run: python "$BOT_SOURCE_DIR/backup.py" backup

      - name: Save queue cache
        id: save_queue_cache
        if: ${{ success() && steps.session.outputs.ok == 'true' }}
        uses: actions/cache/save@main
        with:
          path: |
            state/state.db
            state/telegram-api.enc
          key: tiktok-state-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save imported application
        id: save_imported_application
        if: ${{ success() && steps.session.outputs.ok == 'true' }}
        uses: actions/cache/save@main
        with:
          path: app
          key: tiktok-source-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify saved cache and prune older bot caches
        id: verify_saved_cache_and_prune_older_bot_caches
        if: ${{ success() && steps.session.outputs.ok == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$BOT_SOURCE_DIR/workflow_tools.py" prune

      - name: Start next session
        id: start_next_session
        if: ${{ success() && steps.session.outputs.ok == 'true' && steps.session.outputs.reason != 'shutdown' && (inputs.continue || steps.session.outputs.reason == 'restart' || steps.session.outputs.reason == 'upload') }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUE_SESSIONS: ${{ inputs.continue }}
        run: python "$BOT_SOURCE_DIR/workflow_tools.py" dispatch

      - name: Ensure local API for final reports
        id: local_api_reports
        if: ${{ always() && steps.local_api_start.outcome == 'success' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: python "$BOT_SOURCE_DIR/local_api.py" ensure

      - name: Write sanitized diagnostics
        id: write_sanitized_diagnostics
        if: ${{ always() }}
        env:
          SESSION_OK: ${{ steps.session.outputs.ok }}
          SESSION_REASON: ${{ steps.session.outputs.reason }}
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          python - <<'PY'
          import importlib.metadata
          import os
          from pathlib import Path
          lines = ['TikTok bot diagnostics',
                   'Session completed: '+os.getenv('SESSION_OK',''),
                   'Stop reason: '+os.getenv('SESSION_REASON',''),
                   'Workflow status: '+os.getenv('WORKFLOW_STATUS','')]
          for package in ('gallery-dl','aiogram','boto3','Pillow'):
              try:
                  lines.append(package+': '+importlib.metadata.version(package))
              except importlib.metadata.PackageNotFoundError:
                  lines.append(package+': not installed')
          Path('diagnostics.txt').write_text('\n'.join(lines)+'\n')
          PY

      - name: Send diagnostics to Telegram
        id: send_diagnostics_to_telegram
        if: always()
        continue-on-error: true
        env:
          WORKFLOW_STATUS: ${{ job.status }}
          WORKFLOW_STEPS: ${{ toJSON(steps) }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 "$RUNNER_TEMP/telegram_logs.py" diagnostics diagnostics.txt

      - name: Stop local Telegram Bot API
        id: local_api_stop
        if: ${{ always() && steps.local_api_start.outcome == 'success' }}
        continue-on-error: true
        run: python "$BOT_SOURCE_DIR/local_api.py" stop
